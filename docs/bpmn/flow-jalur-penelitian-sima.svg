<svg xmlns="http://www.w3.org/2000/svg" width="6400" height="1900" viewBox="0 0 6400 1900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#b91c1c"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}.subtitle{font:15px Arial,sans-serif;fill:#475569}
      .lane-title{font:700 16px Arial,sans-serif;fill:#0f172a}.task-text{font:14px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:12px Arial,sans-serif;fill:#334155;text-anchor:middle}.label{font:12px Arial,sans-serif;fill:#334155}.gw-text{font:13px Arial,sans-serif;fill:#0f172a;text-anchor:middle;font-weight:600}
      .task{fill:#fff;stroke:#334155;stroke-width:2}.user{fill:#eff6ff}.service{fill:#ecfdf5}.review{fill:#fff7ed}.decision{fill:#fefce8}.reject{fill:#fff1f2;stroke:#b91c1c}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.reject-flow{fill:none;stroke:#b91c1c;stroke-width:2;marker-end:url(#arrow-red)}
      .message{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}.association{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:3 5}.gateway{fill:#fff;stroke:#334155;stroke-width:2}.event{fill:#fff;stroke:#334155;stroke-width:3}.end{fill:#fff;stroke-width:7}.note{fill:#fffbeb;stroke:#a16207;stroke-width:1.5}.lane{stroke:#64748b;stroke-width:1.5}.lane-a{fill:#f8fafc}.lane-b{fill:#f1f5f9}.pool-label{font:700 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.section{font:700 14px Arial,sans-serif;fill:#1d4ed8}.branch{fill:none;stroke:#3b82f6;stroke-width:1.5;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="6400" height="1900" fill="#ffffff"/>
  <text class="title" x="70" y="48">BPMN — Pendaftaran Jalur Penelitian SIMA</text>
  <text class="subtitle" x="70" y="75">Satu proses, lima lane • Topik Dosen dan Judul Mandiri • tiga hasil akhir</text>

  <!-- Pool and five lanes -->
  <rect x="40" y="190" width="6320" height="1580" fill="none" stroke="#334155" stroke-width="3"/>
  <rect class="lane lane-a" x="40" y="190" width="6320" height="330"/><rect class="lane lane-b" x="40" y="520" width="6320" height="400"/>
  <rect class="lane lane-a" x="40" y="920" width="6320" height="280"/><rect class="lane lane-b" x="40" y="1200" width="6320" height="260"/>
  <rect class="lane lane-a" x="40" y="1460" width="6320" height="310"/>
  <line x1="105" y1="190" x2="105" y2="1770" stroke="#334155" stroke-width="2"/>
  <text class="lane-title" transform="translate(78 355) rotate(-90)" text-anchor="middle">Mahasiswa</text>
  <text class="lane-title" transform="translate(78 720) rotate(-90)" text-anchor="middle">Sistem SIMA</text>
  <text class="lane-title" transform="translate(78 1060) rotate(-90)" text-anchor="middle">Calon Dosen Pembimbing / Pemilik Topik</text>
  <text class="lane-title" transform="translate(78 1330) rotate(-90)" text-anchor="middle">Ketua Cluster</text>
  <text class="lane-title" transform="translate(78 1615) rotate(-90)" text-anchor="middle">Sekretaris Prodi</text>

  <!-- start and eligibility -->
  <circle class="event" cx="145" cy="280" r="20"/><text class="small" x="145" y="315">Mulai</text>
  <rect class="task user" x="200" y="238" width="220" height="84" rx="12"/><text class="task-text" x="310" y="272"><tspan x="310">Membuka pendaftaran</tspan><tspan x="310" dy="19">jalur penelitian</tspan></text>
  <rect class="task service" x="485" y="605" width="260" height="92" rx="12"/><text class="task-text" x="615" y="638"><tspan x="615">Memeriksa periode dan</tspan><tspan x="615" dy="19">kelayakan mahasiswa</tspan></text><text class="small" x="615" y="680">periode aktif • eligible</text>
  <polygon class="gateway" points="835,610 880,655 835,700 790,655"/><path d="M820 640 L850 670 M850 640 L820 670" stroke="#334155" stroke-width="3"/><text class="gw-text" x="835" y="730">Mahasiswa memenuhi syarat?</text>
  <rect class="task reject" x="920" y="742" width="245" height="86" rx="12"/><text class="task-text" x="1042" y="775"><tspan x="1042">Tampilkan alasan tidak</tspan><tspan x="1042" dy="19">memenuhi syarat</tspan></text>
  <circle class="event end" cx="1240" cy="785" r="23" stroke="#b91c1c"/><text class="small" x="1240" y="825">Pendaftaran tidak dapat diproses</text>
  <path class="flow" d="M165 280 H200"/><path class="flow" d="M420 280 H455 V651 H485"/><path class="flow" d="M745 651 H790"/>
  <path class="reject-flow" d="M835 700 V785 H920"/><text class="label" x="850" y="752">Tidak</text><path class="reject-flow" d="M1165 785 H1217"/>

  <!-- type split -->
  <polygon class="gateway" points="1830,235 1875,280 1830,325 1785,280"/><path d="M1815 265 L1845 295 M1845 265 L1815 295" stroke="#334155" stroke-width="3"/><text class="gw-text" x="1830" y="350">Jenis pengajuan?</text>
  <path class="flow" d="M835 610 V280 H1785"/><text class="label" x="850" y="590">Ya</text>
  <rect class="branch" x="1900" y="200" width="2380" height="530" rx="18"/><text class="section" x="1920" y="225">CABANG A — TOPIK DOSEN</text>
  <rect class="branch" x="1900" y="740" width="2380" height="450" rx="18"/><text class="section" x="1920" y="765">CABANG B — JUDUL MANDIRI</text>

  <!-- lecturer topic branch -->
  <rect class="task user" x="1930" y="245" width="190" height="76" rx="12"/><text class="task-text" x="2025" y="276"><tspan x="2025">Memilih topik</tspan><tspan x="2025" dy="19">prioritas pertama</tspan></text>
  <rect class="task user" x="2160" y="245" width="210" height="76" rx="12"/><text class="task-text" x="2265" y="276"><tspan x="2265">Memilih topik 2–3</tspan><tspan x="2265" dy="19">sebagai alternatif</tspan></text>
  <rect class="task user" x="2410" y="245" width="205" height="76" rx="12"/><text class="task-text" x="2512" y="276"><tspan x="2512">Konfirmasi dan</tspan><tspan x="2512" dy="19">kirim pengajuan</tspan></text>
  <rect class="task service" x="2660" y="555" width="300" height="120" rx="12"/><text class="task-text" x="2810" y="582"><tspan x="2810">Validasi pengajuan topik</tspan><tspan x="2810" dy="18">periode • eligible • tiada pengajuan aktif</tspan><tspan x="2810" dy="18">tidak duplikat • topik tersedia</tspan><tspan x="2810" dy="18">dosen aktif • kuota tersedia</tspan></text>
  <polygon class="gateway" points="3035,570 3080,615 3035,660 2990,615"/><path d="M3020 600 L3050 630 M3050 600 L3020 630" stroke="#334155" stroke-width="3"/><text class="gw-text" x="3035" y="690">Data pengajuan valid?</text>
  <rect class="task service" x="3130" y="555" width="230" height="92" rx="12"/><text class="task-text" x="3245" y="587"><tspan x="3245">Simpan pengajuan dan</tspan><tspan x="3245" dy="19">reservasi topik</tspan></text>
  <rect class="task review" x="3410" y="972" width="300" height="125" rx="12"/><text class="task-text" x="3560" y="1000"><tspan x="3560">Review topik oleh dosen</tspan><tspan x="3560" dy="19">pemilik topik</tspan><tspan x="3560" dy="24">Setujui / Tolak</tspan></text><line x1="3552" y1="1064" x2="3552" y2="1086" stroke="#334155" stroke-width="2"/><line x1="3560" y1="1064" x2="3560" y2="1086" stroke="#334155" stroke-width="2"/><line x1="3568" y1="1064" x2="3568" y2="1086" stroke="#334155" stroke-width="2"/>
  <circle cx="3680" cy="1097" r="18" fill="#fff" stroke="#92400e" stroke-width="2"/><line x1="3680" y1="1084" x2="3680" y2="1097" stroke="#92400e" stroke-width="2"/><line x1="3680" y1="1097" x2="3690" y2="1103" stroke="#92400e" stroke-width="2"/><text class="small" x="3680" y="1135">Batas waktu review</text>
  <rect class="task service" x="3760" y="555" width="235" height="92" rx="12"/><text class="task-text" x="3878" y="582"><tspan x="3878">Evaluasi setelah semua</tspan><tspan x="3878" dy="18">keputusan / timeout</tspan></text>
  <polygon class="gateway" points="4070,560 4115,605 4070,650 4025,605"/><path d="M4055 590 L4085 620 M4085 590 L4055 620" stroke="#334155" stroke-width="3"/><text class="gw-text" x="4070" y="683">Ada topik yang disetujui?</text>
  <rect class="task service" x="4180" y="555" width="250" height="92" rx="12"/><text class="task-text" x="4305" y="583"><tspan x="4305">Pilih persetujuan dengan</tspan><tspan x="4305" dy="19">prioritas tertinggi</tspan></text>
  <path class="flow" d="M1875 280 H1930"/><text class="label" x="1885" y="265">Topik Dosen</text><path class="flow" d="M2120 283 H2160"/><path class="flow" d="M2370 283 H2410"/><path class="flow" d="M2615 283 H2635 V615 H2660"/><path class="flow" d="M2960 615 H2990"/>
  <path class="flow" d="M3080 615 H3130"/><text class="label" x="3095" y="601">Ya</text><path class="flow" d="M3360 601 H3380 V1035 H3410"/><path class="flow" d="M3710 1035 H3735 V601 H3760"/><path class="flow" d="M3995 601 H4025"/><path class="flow" d="M4115 605 H4180"/><text class="label" x="4130" y="590">Ya</text>

  <!-- independent title branch -->
  <rect class="task user" x="1930" y="385" width="260" height="98" rx="12"/><text class="task-text" x="2060" y="415"><tspan x="2060">Mengisi judul, deskripsi,</tspan><tspan x="2060" dy="19">dan keyword (bila perlu)</tspan></text>
  <rect class="task user" x="2240" y="385" width="270" height="98" rx="12"/><text class="task-text" x="2375" y="415"><tspan x="2375">Memilih cluster dan calon</tspan><tspan x="2375" dy="19">dosen sesuai cluster</tspan></text>
  <rect class="task service" x="2570" y="775" width="295" height="110" rx="12"/><text class="task-text" x="2717" y="805"><tspan x="2717">Validasi kelengkapan, cluster,</tspan><tspan x="2717" dy="19">status dosen, dan kuota</tspan></text>
  <polygon class="gateway" points="2940,785 2985,830 2940,875 2895,830"/><path d="M2925 815 L2955 845 M2955 815 L2925 845" stroke="#334155" stroke-width="3"/><text class="gw-text" x="2940" y="902">Data pengajuan valid?</text>
  <rect class="task user" x="3040" y="385" width="220" height="84" rx="12"/><text class="task-text" x="3150" y="418"><tspan x="3150">Konfirmasi dan</tspan><tspan x="3150" dy="19">kirim pengajuan</tspan></text>
  <rect class="task review" x="3320" y="1115" width="245" height="74" rx="12"/><text class="task-text" x="3442" y="1145"><tspan x="3442">Review oleh calon dosen</tspan><tspan x="3442" dy="19">Setujui / Tolak</tspan></text>
  <polygon class="gateway" points="3640,1107 3685,1152 3640,1197 3595,1152"/><path d="M3625 1137 L3655 1167 M3655 1137 L3625 1167" stroke="#334155" stroke-width="3"/><text class="gw-text" x="3820" y="1157">Disetujui calon dosen pembimbing?</text>
  <path class="flow" d="M1830 325 V434 H1930"/><text class="label" x="1842" y="385">Judul Mandiri</text><path class="flow" d="M2190 434 H2240"/><path class="flow" d="M2510 434 H2540 V830 H2570"/><path class="flow" d="M2865 830 H2895"/><path class="flow" d="M2940 785 V720 H3010 V427 H3040"/><text class="label" x="2952" y="770">Ya</text><path class="flow" d="M3260 427 H3290 V1152 H3320"/><path class="flow" d="M3565 1152 H3595"/>

  <!-- rejection rail: branch validation/review failures, cluster/final failures -->
  <polygon class="gateway" points="4510,830 4550,870 4510,910 4470,870"/><text x="4510" y="878" text-anchor="middle" font-family="Arial" font-size="24">X</text>
  <rect class="task reject" x="5620" y="790" width="240" height="92" rx="12"/><text class="task-text" x="5740" y="822"><tspan x="5740">Ubah status ditolak,</tspan><tspan x="5740" dy="19">lepas reservasi, beri tahu</tspan></text>
  <circle class="event end" cx="5960" cy="836" r="23" stroke="#b91c1c"/><text class="small" x="5960" y="877">Pendaftaran penelitian ditolak</text>
  <path class="reject-flow" d="M3035 660 V710 H4440 V870 H4470"/><text class="label" x="3050" y="700">Tidak</text>
  <path class="reject-flow" d="M2940 875 V930 H4410 V870 H4470"/><text class="label" x="2955" y="922">Tidak</text>
  <path class="reject-flow" d="M4070 650 V700 H4380 V870 H4470"/><text class="label" x="4085" y="690">Tidak / semua timeout</text>
  <path class="reject-flow" d="M3640 1197 V1220 H4350 V870 H4470"/><text class="label" x="3655" y="1213">Tidak</text>
  <path class="reject-flow" d="M4550 870 H5620"/><path class="reject-flow" d="M5860 836 H5937"/>

  <!-- merge and cluster availability -->
  <polygon class="gateway" points="4510,560 4550,600 4510,640 4470,600"/><text x="4510" y="608" text-anchor="middle" font-family="Arial" font-size="24">X</text><text class="small" x="4510" y="667">Jalur bergabung</text>
  <path class="flow" d="M4430 601 H4470"/>
  <path class="flow" d="M3685 1152 H4250 V600 H4470"/><text class="label" x="3700" y="1138">Ya</text>
  <polygon class="gateway" points="4660,555 4705,600 4660,645 4615,600"/><path d="M4645 585 L4675 615 M4675 585 L4645 615" stroke="#334155" stroke-width="3"/><text class="gw-text" x="4660" y="675">Ketua Cluster tersedia?</text>
  <path class="flow" d="M4550 600 H4615"/>
  <rect class="task decision" x="4750" y="1518" width="260" height="88" rx="12"/><text class="task-text" x="4880" y="1550"><tspan x="4880">Menetapkan</tspan><tspan x="4880" dy="19">Ketua Cluster</tspan></text>
  <path class="flow" d="M4660 645 V1562 H4750"/><text class="label" x="4675" y="700">Tidak</text>

  <!-- cluster review and final decision -->
  <rect class="task review" x="4820" y="1260" width="255" height="92" rx="12"/><text class="task-text" x="4947" y="1292"><tspan x="4947">Validasi topik / judul</tspan><tspan x="4947" dy="19">dan kesesuaian cluster</tspan></text>
  <path class="flow" d="M4705 600 H4785 V1306 H4820"/><text class="label" x="4720" y="586">Ya</text><path class="flow" d="M5010 1562 H5100 V1306 H5075"/>
  <polygon class="gateway" points="5150,1261 5195,1306 5150,1351 5105,1306"/><path d="M5135 1291 L5165 1321 M5165 1291 L5135 1321" stroke="#334155" stroke-width="3"/><text class="gw-text" x="5150" y="1380">Disetujui Ketua Cluster?</text>
  <path class="flow" d="M5075 1306 H5105"/>
  <path class="reject-flow" d="M5150 1351 V1420 H5480 V870 H4550"/><text class="label" x="5165" y="1408">Tidak</text>
  <rect class="task decision" x="5260" y="1510" width="250" height="92" rx="12"/><text class="task-text" x="5385" y="1542"><tspan x="5385">Memberikan keputusan</tspan><tspan x="5385" dy="19">final</tspan></text>
  <polygon class="gateway" points="5590,1511 5635,1556 5590,1601 5545,1556"/><path d="M5575 1541 L5605 1571 M5605 1541 L5575 1571" stroke="#334155" stroke-width="3"/><text class="gw-text" x="5590" y="1630">Disetujui Sekretaris Prodi?</text>
  <path class="flow" d="M5195 1306 H5230 V1556 H5260"/><text class="label" x="5205" y="1292">Ya</text><path class="flow" d="M5510 1556 H5545"/>
  <path class="reject-flow" d="M5590 1511 V930 H5550 V870 H4550"/><text class="label" x="5605" y="1495">Tidak</text>

  <!-- approval -->
  <rect class="task service" x="5710" y="560" width="260" height="100" rx="12"/><text class="task-text" x="5840" y="590"><tspan x="5840">Tetapkan topik / judul dan</tspan><tspan x="5840" dy="19">dosen pembimbing</tspan><tspan x="5840" dy="19">Status: disetujui</tspan></text>
  <rect class="task user" x="6020" y="245" width="210" height="76" rx="12"/><text class="task-text" x="6125" y="276"><tspan x="6125">Melihat hasil</tspan><tspan x="6125" dy="19">pendaftaran</tspan></text>
  <circle class="event end" cx="6310" cy="283" r="23" stroke="#15803d"/><text class="small" x="6250" y="345">Pendaftaran penelitian disetujui</text>
  <path class="flow" d="M5635 1556 H5680 V610 H5710"/><text class="label" x="5645" y="1542">Ya</text><path class="flow" d="M5970 610 H5990 V283 H6020"/><path class="flow" d="M6230 283 H6287"/>

  <!-- legend -->
  <rect x="70" y="1800" width="6260" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect class="task user" x="100" y="1818" width="100" height="34" rx="7"/><text class="small" x="150" y="1840">User task</text>
  <rect class="task service" x="235" y="1818" width="105" height="34" rx="7"/><text class="small" x="287" y="1840">Service task</text>
  <rect class="task review" x="375" y="1818" width="110" height="34" rx="7"/><text class="small" x="430" y="1840">Review task</text>
  <polygon class="gateway" points="545,1815 565,1835 545,1855 525,1835"/><text class="small" x="635" y="1840">XOR gateway</text>
  <line class="flow" x1="730" y1="1835" x2="820" y2="1835"/><text class="small" x="880" y="1840">Sequence flow</text>
  <line class="message" x1="970" y1="1835" x2="1060" y2="1835"/><text class="small" x="1120" y="1840">Message flow</text>
  <line x1="1290" y1="1823" x2="1290" y2="1847" stroke="#334155" stroke-width="2"/><line x1="1298" y1="1823" x2="1298" y2="1847" stroke="#334155" stroke-width="2"/><line x1="1306" y1="1823" x2="1306" y2="1847" stroke="#334155" stroke-width="2"/><text class="label" x="1320" y="1840">parallel multi-instance (1–3 dosen) • event jam = timer boundary • garis merah = jalur penolakan</text>
</svg>
